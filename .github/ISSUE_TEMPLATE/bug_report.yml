name: Bug report
description: Report a problem using synthetic or sanitized evidence.
body:
  - type: markdown
    attributes:
      value: Do not include company names, real internal addresses/paths, credentials, files or private logs. Use a synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected/actual behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Source/destination verification and sanitized error details
