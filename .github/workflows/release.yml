name: Verified Windows prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/windows.yml
  publish:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-package
          path: artifacts/package
      - name: Check tag, payload hash and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $info = Get-Content artifacts/package/build-info.json | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          if ($info.commit -ne $commit -or "v$($info.version)" -ne $env:GITHUB_REF_NAME) { throw 'Tag/build mismatch.' }
          $line = (Get-Content artifacts/package/SHA256SUMS).Trim()
          $hash,$name = $line -split '  ',2
          if ((Get-FileHash "artifacts/package/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Package checksum mismatch.' }
          gh release create $env:GITHUB_REF_NAME "artifacts/package/$name" artifacts/package/SHA256SUMS artifacts/package/build-info.json --verify-tag --prerelease --title "SafeFileSync $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
