name: Windows safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test SafeFileSync.slnx -c Release --filter "Category!=Smb" --logger "trx;LogFileName=safety.trx"
      - run: dotnet publish src/SafeFileSync.App -c Release -r win-x64 --self-contained true -o artifacts/app
      - name: WPF executable launch smoke
        run: ./scripts/Smoke-App.ps1 -Executable artifacts/app/SafeFileSync.App.exe
      - name: Isolate single executable without sidecar libraries
        run: |
          New-Item -ItemType Directory -Path artifacts/standalone | Out-Null
          Copy-Item artifacts/app/SafeFileSync.App.exe artifacts/standalone/
      - name: Standalone EXE compare and copy UI acceptance
        shell: powershell
        run: ./scripts/Test-UI.ps1 -Executable artifacts/standalone/SafeFileSync.App.exe
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ui-evidence
          path: artifacts/ui
      - name: Package verified build and smoke-test extracted ZIP
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-package
          path: artifacts/package/*
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'


  smb:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Create isolated loopback SMB fixture
        shell: pwsh
        run: |
          $name = 'SfsCI-' + [guid]::NewGuid().ToString('N')
          $path = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $path | Out-Null
          Start-Service LanmanServer
          New-SmbShare -Name $name -Path $path -FullAccess "$env:COMPUTERNAME\$env:USERNAME" | Out-Null
          "SFS_SMB_NAME=$name" >> $env:GITHUB_ENV
          "SFS_SMB_LOCAL=$path" >> $env:GITHUB_ENV
          "SFS_SMB_UNC=\\localhost\$name" >> $env:GITHUB_ENV
          $drive = @('Z:', 'Y:', 'X:', 'W:') | Where-Object { -not (Test-Path "$_\") -and -not (Get-SmbMapping -LocalPath $_ -ErrorAction SilentlyContinue) } | Select-Object -First 1
          if (-not $drive) { throw 'No unused drive letter for isolated SMB fixture.' }
          New-SmbMapping -LocalPath $drive -RemotePath "\\localhost\$name" -Persistent $false | Out-Null
          "SFS_SMB_DRIVE=$drive\" >> $env:GITHUB_ENV
      - name: Test local to SMB and SMB to local with alias guards
        run: dotnet test tests/SafeFileSync.Tests -c Release --filter "Category=Smb" --logger "trx;LogFileName=smb.trx"
      - name: Remove isolated SMB fixture
        if: always()
        shell: pwsh
        run: |
          if ($env:SFS_SMB_DRIVE) { Remove-SmbMapping -LocalPath $env:SFS_SMB_DRIVE.TrimEnd('\') -Force }
          if ($env:SFS_SMB_NAME) { Remove-SmbShare -Name $env:SFS_SMB_NAME -Force }
          if ($env:SFS_SMB_LOCAL -and (Test-Path $env:SFS_SMB_LOCAL)) { Remove-Item $env:SFS_SMB_LOCAL -Recurse -Force }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: smb-test-results
          path: '**/TestResults/*.trx'
